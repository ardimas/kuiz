<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Realtime</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><section id="gate" class="card"><h1>Quiz Realtime</h1><p>Kode akses situs</p><input id="sitekey"><button onclick="verify()">Masuk</button><p id="msg"></p></section><section id="join" class="card hidden"><h1>Gabung Quiz</h1><input id="pin" maxlength="6" placeholder="PIN 6 digit"><input id="name" maxlength="40" placeholder="Nama"><button onclick="join()">Gabung</button><p id="joinmsg"></p></section><section id="game" class="card hidden"><div class="row"><b id="roomlabel"></b><span id="timer"></span></div><h2 id="q"></h2><div id="answers" class="answers"></div><p id="result"></p><div id="score"></div></section></main><script src="/app.js"></script></body></html>
